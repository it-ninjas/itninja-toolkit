name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Read version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME:1}" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: mvn --batch-mode -Drevision=${{ steps.version.outputs.value }} clean package
      - name: Create GitHub release with JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          target/itninja-toolkit-${{ steps.version.outputs.value }}.jar#itninja-toolkit-${{ steps.version.outputs.value }}.jar
          --generate-notes
          --title "$GITHUB_REF_NAME"
